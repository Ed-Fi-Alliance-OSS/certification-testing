name: DataStandard V5 MTSS

# MTSS (Intervention) certification chains on ci-v5. Separate from the SIS workflow so that
# SIS-only changes never wait for, or fail on, the shared MTSS data on ci-v5 (and vice versa).

on:
  pull_request:
    paths:
      - 'scripts/run-scenarios.cjs'
      - 'bruno/Tests/v5/Intervention/**'
      - 'bruno/Tests/environments/**'
      - 'bruno/MTSS/**'
      - 'bruno/Sample Data/MTSS/**'
      - 'bruno/package-lock.json'
      - '.github/workflows/on-pullrequest-run-tests-v5-mtss.yml'
      - '.github/scripts/qa-summary-comment.cjs'
  push:
    branches: [ main ]
    paths:
      - 'scripts/run-scenarios.cjs'
      - 'bruno/Tests/v5/Intervention/**'
      - 'bruno/Tests/environments/**'
      - 'bruno/MTSS/**'
      - 'bruno/Sample Data/MTSS/**'
      - 'bruno/package-lock.json'
  workflow_dispatch:
    inputs:
      env:
        description: 'Bruno environment name (default ci-v5.ed-fi.org)'
        required: false
        default: 'ci-v5.ed-fi.org'

permissions:
  contents: read
  pull-requests: write

env:
  BRUNO_ENV: ${{ github.event.inputs.env || 'ci-v5.ed-fi.org' }}

jobs:
  mtss:
    name: Run MTSS Tests
    runs-on: ubuntu-latest
    # The two path chains take about 4 minutes; time waiting in the concurrency queue does not count.
    timeout-minutes: 15
    # The MTSS chains Reset and re-seed fixed identities (school 9999999911) on a shared
    # environment, so only one MTSS run per environment may execute at a time, across all
    # PRs and branches. Never cancel a run in progress: it would leave half-seeded data.
    concurrency:
      group: mtss-scenarios-${{ github.event.inputs.env || 'ci-v5.ed-fi.org' }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Use Node.js 24
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: bruno/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --prefix bruno
          echo "$GITHUB_WORKSPACE/bruno/node_modules/.bin" >> $GITHUB_PATH

      - name: Inject credentials into Bruno environment file
        env:
          CLIENT_ID: ${{ secrets.EDFI_CLIENT_ID_V5 }}
          CLIENT_SECRET: ${{ secrets.EDFI_CLIENT_SECRET_V5 }}
        run: |
          ENV_FILE="bruno/Tests/environments/${BRUNO_ENV}.bru"
          if [ ! -f "$ENV_FILE" ]; then echo "ERROR: env file not found: $ENV_FILE"; exit 1; fi
          ENV_FILE="$ENV_FILE" node -e "
            const fs = require('fs');
            const f = process.env.ENV_FILE;
            let c = fs.readFileSync(f, 'utf8');
            c = c.replace(/edFiClientId:.*/, 'edFiClientId: ' + process.env.CLIENT_ID);
            c = c.replace(/edFiClientSecret:.*/, 'edFiClientSecret: ' + process.env.CLIENT_SECRET);
            fs.writeFileSync(f, c);
          "

      - name: Mask client secret (if present)
        run: |
          ENV_FILE="bruno/Tests/environments/${BRUNO_ENV}.bru"
          if [ -f "$ENV_FILE" ]; then
            SECRET_LINE=$(grep -E 'edFiClientSecret:' "$ENV_FILE" || true)
            if [ -n "$SECRET_LINE" ]; then
              SECRET_VAL=$(echo "$SECRET_LINE" | sed -E 's/.*edFiClientSecret:\s*([^ ]+)/\1/')
              echo "::add-mask::$SECRET_VAL"
            fi
          fi

      - name: Run MTSS QA Scenarios (one Bruno run per path chain)
        id: runmtss
        run: |
          set -e
          node scripts/run-scenarios.cjs --collection mtss --env "$BRUNO_ENV" --version v5 --include-steps || EXIT=$?
          if [ -n "$EXIT" ]; then echo "exit_code=$EXIT" >> $GITHUB_OUTPUT; else echo "exit_code=0" >> $GITHUB_OUTPUT; fi

      - name: Show aggregate summary
        if: always()
        run: |
          if [ -f automation-testing/results/summary.json ]; then
            jq '{exitStatus, totals}' automation-testing/results/summary.json || cat automation-testing/results/summary.json
          else
            echo "summary.json not found"
          fi

      # Raw Bruno output (last-output.txt) is not uploaded: artifacts are never masked.
      - name: Upload MTSS QA artifacts
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: qa-scenarios-results-v5-mtss
          path: |
            automation-testing/results/*.json
          if-no-files-found: warn

      - name: Comment summary on PR
        if: github.event_name == 'pull_request' && !cancelled()
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // Creates the summary comment once, then updates it on later runs.
            const { postSummary } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/qa-summary-comment.cjs`);
            await postSummary({
              github, context,
              summaryPath: 'automation-testing/results/summary.json',
              title: 'MTSS QA Scenarios Summary (DataStandard V5)',
              marker: 'qa-scenarios-summary:mtss:v5',
              firstColumn: 'Path chain'
            });

      - name: Fail if MTSS scenarios failed
        if: steps.runmtss.outputs.exit_code != '0'
        run: |
          echo "MTSS scenario script exited with code ${{ steps.runmtss.outputs.exit_code }}"; exit 1
